<!DOCTYPE html>
<html>
<head>
    <title>Отзывы</title>
</head>
<body>
    <h1>Все отзывы</h1>
    <ul>
    {% for review in reviews %}
        <li>
            <strong>{{ review.user.username }}</strong> о товаре "{{ review.product.name }}":<br>
            {{ review.text }} (оценка: {{ review.rating }}/5)
        </li>
    {% empty %}
        <li>Отзывов пока нет.</li>
    {% endfor %}
    </ul>
</body>
</html>
